name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r requirements-dev.txt
      - name: Format check
        run: black --check contracts tests
      - name: Lint
        run: flake8 contracts tests --max-line-length=100 --ignore=E501,W503,E203,E402,F403,F405
      - name: GenVM lint (the check stewards run)
        run: |
          python3 -m pip install genvm-linter
          sh scripts/lint_current_sdk.sh
      - name: Tests
        run: python3 -m pytest -q
      - name: Deployed code equals this source
        run: python3 scripts/verify_deployment.py

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Outcome tests (a refused payment is never shown as success)
        run: npm test
      - name: Static build
        run: npm run build
